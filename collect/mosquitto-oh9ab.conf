# Mosquitto-asetukset OH9AB:n mittausdatan keruuseen.
# Asennetaan: /etc/mosquitto/conf.d/oh9ab.conf
#
# Tietoinen valinta: salasanatunnistus päällä, anonyymi kielletty.
# Avoin broker joutuisi väärinkäytön kohteeksi päivissä.

listener 1883
protocol mqtt

# Ei anonyymejä yhteyksiä. Jokaiselle kerääjälle oma tunnus, jotta
# yksittäisen voi sulkea muita häiritsemättä ja nähdään kuka lähettää.
allow_anonymous false
password_file /etc/mosquitto/oh9ab.passwd
acl_file /etc/mosquitto/oh9ab.acl

# Meshtastic-solmut lähettävät jatkuvasti; pidetään jonot pieninä ettei
# katkon jälkeen tule ryöppyä vanhaa dataa jolla ei ole enää arvoa.
max_queued_messages 200
persistence false

log_dest syslog
log_type warning
log_type error
log_type notice
# connection_messages näyttää kuka yhdistää — hyödyllinen kun ystävä
# soittaa ettei hänen solmunsa näy.
connection_messages true
